name: App
options: { bundleIdPrefix: com.duckyisc00l, deploymentTarget: { iOS: "15.0" } }
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["AppAssets/**", "Info.plist"]
      - path: App/AppAssets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duckyisc00l.twozerogame
        PRODUCT_NAME: App
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_OUTPUT_FORMAT: XML
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.3.3"
        CURRENT_PROJECT_VERSION: "133"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
