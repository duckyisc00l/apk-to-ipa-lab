name: App
options: { bundleIdPrefix: com.duckyisc00l, deploymentTarget: { iOS: "16.0" } }
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["AppAssets/**", "Info.plist"]
      - path: App/AppAssets
        type: folder
        buildPhase: resources
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duckyisc00l.ricochlimerewrite
        PRODUCT_NAME: App
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_OUTPUT_FORMAT: XML
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.14.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks", "@loader_path/Frameworks"]
