name: route-renpy
# Ren'Py route: APK -> game/ folder (x- prefixes stripped; .rpyc/.rpa run unchanged) -> Ren'Py SDK of the
# same version + renios -> "renpy.sh launcher ios_create" (no GUI) -> xcodebuild unsigned -> IPA.
on:
  workflow_dispatch:
    inputs:
      pick:
        description: "owner/repo tag asset (blank = smallest Ren'Py APK found)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: route-renpy
  cancel-in-progress: true
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.prep.outputs.version }}
      major: ${{ steps.prep.outputs.major }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick the smallest Ren'Py APK under 200 MB
        run: |
          mkdir -p out dl
          if [ -n "${{ inputs.pick }}" ]; then echo "${{ inputs.pick }}" > out/candidates.txt; else
          while read r; do
            gh api "repos/$r/releases?per_page=5" --jq ".[] | .tag_name as \$t | .assets[] | select(.name|test(\"\\\\.apk$\")) | select(.size < 200000000) | \"\(.size) $r \(\$t) \(.name)\"" 2>/dev/null | head -1
          done < ci/renpy/candidates.txt | sort -n | awk '{print $2, $3, $4}' > out/candidates.txt; fi
          cat out/candidates.txt | head -20
      - name: Download, unpack, keep the first that is really Ren'Py
        id: prep
        run: |
          while read repo tag asset; do
            rm -rf dl/* work proj; gh release download "$tag" -R "$repo" -p "$asset" -D dl || continue
            python3 -I ci/unpack.py "dl/$asset" work > /dev/null || continue
            ls work/all/lib/*/ 2>/dev/null | grep -qiE 'renpy|libpy|python' || continue
            python3 -I ci/renpy/prep.py work/all proj | tee out/prep.txt
            grep -q '^files=0' out/prep.txt && continue
            echo "$repo $tag $asset" | tee out/picked.txt; break
          done < out/candidates.txt
          test -s out/picked.txt
          cat out/prep.txt >> "$GITHUB_OUTPUT"
          ls work/all/lib/*/ | tee out/libs.txt; find proj -maxdepth 2 | head -30 | tee out/tree.txt
      - uses: actions/upload-artifact@v4
        with: { name: proj, path: proj }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: find-logs, path: out }
  ipa:
    needs: find
    runs-on: macos-15-intel   # Intel Macs: often free when the Apple-chip ones are busy
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: proj, path: proj }
      - name: Ren'Py SDK + renios (same version, else newest of the same major)
        run: |
          mkdir -p out
          V="${{ needs.find.outputs.version }}"; M="${{ needs.find.outputs.major }}"
          if [ -z "$V" ]; then
            V=$(curl -sSL https://www.renpy.org/dl/ | grep -oE "href=\"$M\.[0-9]+\.[0-9]+/\"" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          fi
          echo "Ren'Py $V" | tee out/renpy.md
          curl -fsSL -o sdk.tar.bz2 "https://www.renpy.org/dl/$V/renpy-$V-sdk.tar.bz2" || curl -fsSL -o sdk.tar.bz2 "https://www.renpy.org/dl/$V/renpy-$V-sdk.tar.bz2"
          [ -s sdk.tar.bz2 ] || { echo "no SDK for $V" | tee -a out/renpy.md; curl -sSL "https://www.renpy.org/dl/$V/" | grep -oE 'href="[^"]+"' | head -30 | tee -a out/renpy.md; exit 1; }
          tar xjf sdk.tar.bz2; SDK=$(ls -d renpy-*-sdk | head -1); echo "SDK=$PWD/$SDK" >> $GITHUB_ENV
          if ! grep -q 'register_command("ios_create"' "$SDK/launcher/game/ios.rpy" 2>/dev/null; then
            # too old for command-line iOS (6.99 has no ios_create): newer Ren'Py of the same Python generation runs old games
            V=$(curl -sSL https://www.renpy.org/dl/ | grep -oE "href=\"$M\.[0-9]+\.[0-9]+/\"" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
            echo "no command-line iOS in this version; using Ren'Py $V" | tee -a out/renpy.md
            rm -rf "$SDK" sdk.tar.bz2; curl -fsSL -o sdk.tar.bz2 "https://www.renpy.org/dl/$V/renpy-$V-sdk.tar.bz2"
            tar xjf sdk.tar.bz2; SDK=$(ls -d renpy-*-sdk | head -1); echo "SDK=$PWD/$SDK" >> $GITHUB_ENV
          fi
          curl -fsSL -o renios.zip "https://www.renpy.org/dl/$V/renpy-$V-renios.zip" && unzip -q renios.zip -d "$SDK" || echo "no renios zip for $V" | tee -a out/renpy.md
          ls "$SDK" | tee -a out/renpy.md
      - name: ios_create (command line, no GUI)
        run: |
          cd "$SDK"
          ./renpy.sh launcher ios_create "$GITHUB_WORKSPACE/proj" "$GITHUB_WORKSPACE/xcode" 2>&1 | tail -40 | tee -a $GITHUB_WORKSPACE/out/renpy.md
          ls "$GITHUB_WORKSPACE/xcode" | tee -a $GITHUB_WORKSPACE/out/renpy.md
      - name: What renios ships (libraries)
        run: |
          { echo "## libraries in the Xcode project"; find xcode -name '*.a' -o -name '*.xcframework' -maxdepth 4 | sed 's#^xcode/##' | head -60
            echo "## python libs anywhere in renios"; find "$SDK/renios" -iname '*python*' -maxdepth 6 | sed "s#$SDK/##" | head -30
            echo "## LIBRARY_SEARCH_PATHS"; grep -h "LIBRARY_SEARCH_PATHS" -A4 xcode/*.xcodeproj/project.pbxproj | head -20; } 2>&1 | tee -a out/renpy.md
      - name: Link the Python library renios actually ships
        run: |
          # Ren'Py 7.8.x renios ships libpython2.7.a, but its Xcode template asks for python3.9: use what's there
          have=$(ls xcode/prebuilt/release/ | grep -oE 'libpython[0-9.]+\.a' | head -1 | sed -E 's/^lib(.*)\.a$/\1/')
          # every build file (pbxproj, xcconfig) that names another python version
          for f in $(grep -rlE --include='*.pbxproj' --include='*.xcconfig' 'python[0-9]\.[0-9]+' xcode | grep -v '/base/'); do
            grep -oE 'python[0-9]\.[0-9]+' "$f" | sort -u | grep -vx "$have" | while read want; do
              echo "$f: $want -> $have" | tee -a out/renpy.md
              sed -i '' "s/$want/$have/g" "$f"
            done
          done
      - name: xcodebuild (unsigned) -> IPA
        run: |
          cd xcode; P=$(ls -d *.xcodeproj | head -1); S=$(xcodebuild -list -project "$P" | awk '/Schemes:/{getline; print; exit}' | xargs)
          echo "project $P scheme $S" | tee -a ../out/renpy.md
          set +e   # keep going after a failed build so the errors get saved
          xcodebuild -project "$P" -scheme "$S" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > ../out/xcodebuild.log 2>&1; xc=$?
          grep -E -A12 "Undefined symbols|^ld: |error:" ../out/xcodebuild.log | grep -vE "^\s+/Applications" | head -80 | tee -a ../out/renpy.md
          grep -E "\*\* BUILD" ../out/xcodebuild.log | tee -a ../out/renpy.md; [ "$xc" = 0 ] || exit 1
          APP=$(find build/Build/Products -name '*.app' -maxdepth 2 | head -1); mkdir -p Payload && cp -R "$APP" Payload/ && zip -qry ../RenPy.ipa Payload
          ls -la ../RenPy.ipa | tee -a ../out/renpy.md
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ipa-logs, path: out }
      - name: Publish IPA
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "renpy-${{ github.run_number }}" RenPy.ipa -R ${{ github.repository }} --prerelease --notes "Ren'Py route test (unsigned)" || true
  publish:
    needs: [find, ipa]
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with: { path: art, pattern: "*-logs" }
      - run: |
          mkdir -p /tmp/r; for f in $(find art -type f); do tail -300 "$f" > /tmp/r/$(echo "${f#art/}" | tr / -); done
          cd /tmp/r && git init -q -b r-renpy && git config user.name lab-bot && git config user.email lab-bot@users.noreply.github.com
          git add -A && git commit -qm "renpy ${{ github.run_number }}" && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" r-renpy
