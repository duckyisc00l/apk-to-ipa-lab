name: web2-scout
# Find open-source HTML5-engine and Flutter APKs (releases of candidate repos) and name each engine.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/web2/scout.sh ci/web2/candidates.txt
      - name: Publish to r-web2-scout
        if: always()
        run: |
          cd out && git init -q -b r-web2-scout && git config user.name lab-bot && git config user.email lab-bot@users.noreply.github.com
          git add -A && git commit -qm "scout ${{ github.run_number }}" && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" r-web2-scout
