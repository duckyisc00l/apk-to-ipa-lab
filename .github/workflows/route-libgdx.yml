name: route-libgdx
# Skill step E (libGDX) end to end: keep the game's own Java. classes.dex -> Java bytecode (dex2jar),
# drop the Android side, add a libGDX iOS launcher, compile it all for iPhone with MobiVM (RoboVM),
# run it in the iPhone Simulator and package an unsigned IPA.
on:
  workflow_dispatch:
    inputs:
      mode: { default: "build", description: "build, or scout (list libGDX games with APKs in ci/libgdx/candidates.txt)" }
      repo: { default: "Smooth-E/gdxtris" }
      name: { default: "GdxTris" }
      wait: { default: "40", description: "seconds to watch the app in the Simulator" }
  push:
    branches: [main]
    paths: [".github/workflows/route-libgdx.yml"]
permissions:
  contents: write
concurrency:
  group: route-libgdx-${{ inputs.repo || 'default' }}-${{ inputs.mode || 'build' }}
  cancel-in-progress: true
env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ inputs.repo || 'Smooth-E/gdxtris' }}
  NAME: ${{ inputs.name || 'GdxTris' }}
jobs:
  scout:
    if: ${{ inputs.mode == 'scout' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Find libGDX games with APKs, split each one's Java
        run: |
          CANDIDATES=ci/libgdx/candidates.txt MAX_GAMES=25  python3 ci/scout.py | tail -40
          python3 ci/detect.py dl work | tail -30
          for g in $(python3 -c "import json;[print(r['game']) for r in json.load(open('out/detect.json')) if r['engine']=='libGDX']"); do
            echo "## $g" >> out/split.md
            ci/libgdx/dex2jar.sh work/$g /tmp/$g.jar >> out/split.md 2>&1 || { echo "dex2jar failed" >> out/split.md; continue; }
            python3 ci/libgdx/split.py report /tmp/$g.jar /tmp/$g.md > /dev/null; cat /tmp/$g.md >> out/split.md
            ls -la work/$g/lib/*/ 2>/dev/null | grep '\.so' | awk '{print $5, $9}' | sort -u -k2 >> out/split.md
            du -sh work/$g/assets >> out/split.md 2>/dev/null
            # what the Android launcher passes to the game
            for c in $(sed -n 's/^- \(.*\) extends .*/\1/p' /tmp/$g.md | head -3); do
              echo '```' >> out/split.md; javap -c -p -cp /tmp/$g.jar "${c//\//.}" 2>&1 | grep -E "class |new |invokespecial|initialize" | head -20 >> out/split.md; echo '```' >> out/split.md
            done
          done
      - name: Publish to branch r-libgdx
        if: always()
        run: |
          mkdir -p /tmp/r; cp out/*.md /tmp/r/ 2>/dev/null || true
          git config user.name lab-bot && git config user.email lab-bot@users.noreply.github.com
          git checkout --orphan r-libgdx && git rm -rfq . && rm -rf ci dl work out
          cp -r /tmp/r/. . && git add -A && git commit -qm "libgdx scout ${{ github.run_number }}" && git push -f origin r-libgdx

  build:
    if: ${{ (inputs.mode || 'build') == 'build' }}
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - name: Download the APK and unpack it
        run: |
          echo "$REPO" > /tmp/one.txt; CANDIDATES=/tmp/one.txt MAX_GAMES=1 python3 ci/scout.py | tail -3
          python3 ci/detect.py dl work | tail -2
          echo "GAME=$(ls work | head -1)" >> $GITHUB_ENV; echo "APK=$(ls dl/*/* | head -1)" >> $GITHUB_ENV
      - name: Keep the game's Java, compile it for iPhone with MobiVM (simulator app + unsigned IPA)
        run: ci/libgdx/build.sh "$APK" "work/$GAME" "$NAME" out
      - name: Run it in the iPhone Simulator (launch, screenshots, crash check)
        continue-on-error: true
        run: ci/sim/run.sh "out/sim-app/$NAME.app" out/sim "${{ inputs.wait || 40 }}"
      - name: Release the unsigned IPA
        continue-on-error: true
        run: |
          ipa=$(ls out/ipa/*.ipa | head -1); ls -la "$ipa" | tee -a out/libgdx.md
          unzip -l "$ipa" | tail -1 | tee -a out/libgdx.md
          gh release create "$NAME-libgdx-${{ github.run_number }}" "$ipa" -R "${{ github.repository }}" --prerelease --notes "Unsigned IPA (lab test of the libGDX route: the game's own Java compiled for iPhone with MobiVM)."
      - name: Publish to branch r-libgdx
        if: always()
        run: |
          mkdir -p /tmp/r; cp out/*.md /tmp/r/ 2>/dev/null || true; cp -R out/sim /tmp/r/ 2>/dev/null || true
          for l in out/robovm-*.log; do [ -f "$l" ] && { grep -vE "^\[DEBUG\]" "$l" | tail -300 > /tmp/r/$(basename "$l"); }; done
          cp /tmp/gdxios/launcher/lab/*.java /tmp/gdxios/robovm.xml /tmp/r/ 2>/dev/null || true; find /tmp/gdxios/launcher/src -name '*.java' -exec cp {} /tmp/r/ \; 2>/dev/null || true
          git config user.name lab-bot && git config user.email lab-bot@users.noreply.github.com
          git checkout --orphan r-libgdx-$NAME && git rm -rfq . && rm -rf ci dl work out
          cp -r /tmp/r/. . && git add -A && git commit -qm "libgdx build $NAME ${{ github.run_number }}" && git push -f origin r-libgdx-$NAME
