name: route-dotnet
# Xamarin / .NET MAUI route: pull the DLLs out of the APK, decompile them with ILSpy, rebuild the shared
# screens for iOS with the .NET iOS workload on a Mac, run it in the iPhone Simulator, build an unsigned IPA.
on:
  workflow_dispatch:
    inputs:
      repo: { description: "owner/repo with an APK in its releases (empty: first hit in ci/dotnet/candidates.txt)", default: "" }
      stage: { description: "recover | ios", default: "recover" }
  push:
    branches: [main]
    paths: [".github/workflows/route-dotnet.yml", "ci/dotnet/**"]
permissions:
  contents: write
concurrency:
  group: route-dotnet
  cancel-in-progress: true
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      repo: ${{ steps.scout.outputs.repo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - name: Find an open-source .NET app with an APK
        id: scout
        run: |
          python3 -m venv /tmp/v && /tmp/v/bin/pip install -q lz4 dnfile androguard && echo /tmp/v/bin >> $GITHUB_PATH
          export PATH=/tmp/v/bin:$PATH
          if [ -n "${{ inputs.repo }}" ]; then echo "${{ inputs.repo }}" > /tmp/c.txt; else cp ci/dotnet/candidates.txt /tmp/c.txt; fi
          python3 ci/dotnet/scout.py /tmp/c.txt dl
          read repo tag apk kind < out/picked.txt
          echo "repo=$repo" >> $GITHUB_OUTPUT
          echo "REPO=$repo" >> $GITHUB_ENV; echo "TAG=$tag" >> $GITHUB_ENV; echo "APK=$apk" >> $GITHUB_ENV
      - name: Pull the DLLs out and list them
        run: |
          python3 -I ci/dotnet/unpack.py "$APK" asm | tee out/recover.md
          head -3 asm/assemblies.txt >> out/recover.md
          python3 ci/dotnet/listdlls.py asm > out/assemblies.md
          grep '^\*' out/assemblies.md | tee -a out/recover.md
          python3 - "$APK" >> out/recover.md <<'P'
          import sys
          from androguard.core.apk import APK
          a = APK(sys.argv[1]); print("app:", a.get_app_name(), a.get_package(), a.get_androidversion_name())
          P
          unzip -l "$APK" | awk '{print $4}' | grep -vE '^(lib|assemblies)/' | sed 's#/[^/]*$##' | sort | uniq -c | sort -rn | head -40 > out/apk-folders.md
          unzip -l "$APK" | awk '{print $4}' | grep -E '^assets/' > out/apk-assets.md
      - name: Decompile the app's own assemblies (ILSpy)
        run: |
          dotnet tool install -g ilspycmd > /dev/null
          ilspycmd --version | head -1 | tee -a out/recover.md
          mkdir -p rec
          for n in $(cat asm/own.txt); do
            ilspycmd -p -o "rec/$n" -r asm "asm/$n.dll" > "out/ilspy-$n.log" 2>&1; echo "ilspy $n exit $? : $(find rec/$n -name '*.cs' | wc -l) .cs, $(find rec/$n -name '*.xaml' | wc -l) .xaml, $(find rec/$n -type f | wc -l) files" | tee -a out/recover.md
          done
          find rec -type f | grep -v '\.cs$' | head -60 >> out/recover.md
      - name: Real source at the same release (only to compare afterwards)
        run: |
          git clone -q --depth 1 --branch "$TAG" "https://github.com/$REPO" orig || git clone -q --depth 1 "https://github.com/$REPO" orig
          (cd orig && find . -name '*.csproj' -o -name '*.xaml' -o -name '*.cs' | grep -v '/obj/' | sort) > out/orig-files.md
          grep -h -E '<(TargetFrameworks?|PackageReference|UseMaui|MauiVersion)' $(find orig -name '*.csproj') | sort -u >> out/orig-files.md
      - uses: actions/upload-artifact@v4
        with:
          name: rec
          path: |
            rec
            asm
            dl
            out
      - name: Publish to branch r-dotnet
        if: always()
        run: |
          mkdir -p /tmp/r; cp -R out /tmp/r/; cp -R rec /tmp/r/ 2>/dev/null || true
          cd /tmp/r && git init -q -b r-dotnet && git config user.name lab-bot && git config user.email lab-bot@users.noreply.github.com
          git add -A && git commit -qm "dotnet recover ${{ github.run_number }}" && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" r-dotnet
  ios:
    needs: recover
    # the iOS workload follows the newest Xcode (26.x): an older Xcode fails with MT4162 "not available in iOS 18.5"
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: rec }
      - name: Rebuild an iOS project from the recovered C#
        run: |
          python3 -m venv /tmp/v && /tmp/v/bin/pip install -q dnfile androguard pillow
          app=$(grep -l -E 'CreateMauiApp|MauiUIApplicationDelegate|Xamarin.Forms.Application' -r rec --include=*.cs | head -1 | cut -d/ -f2)
          echo "APP=$app" >> $GITHUB_ENV
          mkdir -p out-ios; read repo tag apk kind < out/picked.txt
          /tmp/v/bin/python ci/dotnet/rebuild.py "rec/$app" asm "$apk" ios | tee out-ios/rebuild.log
          cp ios/rebuild.md out-ios/
      - name: .NET SDK and the iOS workload
        run: |
          major=$(grep -o 'net[0-9]*\.0-ios' ios/App.csproj | grep -o '[0-9]*' | head -1)
          echo "{\"sdk\":{\"version\":\"$major.0.100\",\"rollForward\":\"latestFeature\"}}" > ios/global.json
          cd ios; dotnet --version | tee -a ../out-ios/build.md
          dotnet workload install maui-ios > ../out-ios/workload.log 2>&1; echo "workload install exit $?" | tee -a ../out-ios/build.md
          dotnet workload list 2>&1 | grep -iE 'ios|maui' | tee -a ../out-ios/build.md
          # the workload's newest iOS pack for this .NET names the Xcode it was made for (Microsoft.iOS.Sdk.net9.0_26.5 -> Xcode 26.5)
          packs="$(dirname "$(readlink -f "$(which dotnet)")")/packs"
          want=$(ls "$packs" | grep "^Microsoft.iOS.Sdk.net$major.0_" | sed 's/.*_//' | sort -V | tail -1); echo "iOS SDK pack $want wants Xcode $want" | tee -a ../out-ios/build.md
          x=$(ls -d /Applications/Xcode_${want}*.app 2>/dev/null | head -1); [ -n "$x" ] || x=$(ls -d /Applications/Xcode_${want%%.*}.*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$x" ] && sudo xcode-select -s "$x"; xcodebuild -version 2>/dev/null | head -1 | tee -a ../out-ios/build.md
      - name: Build for the iPhone Simulator and run it
        continue-on-error: true
        run: |
          cd ios; tfm=$(grep -o 'net[0-9]*\.0-ios' App.csproj | head -1)
          set +e
          dotnet build App.csproj -f $tfm -c Release -r iossimulator-$([ "$(uname -m)" = arm64 ] && echo arm64 || echo x64) -p:ValidateXcodeVersion=false -o simout > ../out-ios/sim-build.log 2>&1
          b=$?; echo "simulator build exit $b" | tee -a ../out-ios/build.md
          grep -E ' error ' ../out-ios/sim-build.log | sed -E 's#^.*/ios/##; s# \[.*##' | sort -u | head -80 | tee ../out-ios/sim-errors.md
          echo "distinct errors: $(grep -E ' error ' ../out-ios/sim-build.log | sed -E 's# \[.*##' | sort -u | wc -l)" | tee -a ../out-ios/build.md
          [ "$b" = 0 ] || exit 1
          appdir=$(find simout bin -maxdepth 6 -name '*.app' -type d | head -1); echo "app: $appdir" | tee -a ../out-ios/build.md
          bash ../ci/sim/run.sh "$PWD/$appdir" ../out-ios/sim 45 ../ci/dotnet/sim-steps.txt
      - name: Build the unsigned IPA for iPhone
        run: |
          cd ios; tfm=$(grep -o 'net[0-9]*\.0-ios' App.csproj | head -1)
          set +e
          dotnet build App.csproj -f $tfm -c Release -r ios-arm64 -p:ValidateXcodeVersion=false -p:EnableCodeSigning=false -p:CodesignRequireProvisioningProfile=false > ../out-ios/ipa-build.log 2>&1
          b=$?; echo "device build exit $b" | tee -a ../out-ios/build.md
          grep -E ' error ' ../out-ios/ipa-build.log | sed -E 's# \[.*##' | sort -u | head -30 | tee -a ../out-ios/build.md
          [ "$b" = 0 ] || exit 1
          appdir=$(find bin -path '*ios-arm64*' -name '*.app' -type d | head -1)
          mkdir -p Payload && cp -R "$appdir" Payload/ && zip -qry "../$APP.ipa" Payload
          ls -la "../$APP.ipa" | tee -a ../out-ios/build.md; du -sh "$appdir" | tee -a ../out-ios/build.md
          gh release create "dotnet-$APP-${{ github.run_number }}" "../$APP.ipa" -R "${{ github.repository }}" --prerelease --notes "Unsigned IPA (lab test: .NET MAUI app rebuilt for iOS from decompiled C#)."
      - name: Publish to branch r-dotnet-ios
        if: always()
        run: |
          set +e
          mkdir -p /tmp/r/project; cp -R out-ios/. /tmp/r/; for f in /tmp/r/*.log; do tail -150 "$f" > "$f.t" && mv "$f.t" "$f"; done
          (cd ios && tar cf - --exclude lib --exclude bin --exclude obj --exclude simout --exclude Payload . | tar xf - -C /tmp/r/project)
          cd /tmp/r && git init -q -b r-dotnet-ios && git config user.name lab-bot && git config user.email lab-bot@users.noreply.github.com
          git add -A && git commit -qm "dotnet ios ${{ github.run_number }}" && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" r-dotnet-ios
