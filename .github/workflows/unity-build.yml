name: unity-build
# Build a recovered Unity project (from a `recover` run's artifact) into an unsigned IPA.
# mode=compile only compiles the scripts (a few minutes) and lists every C# error.
# Phone-only license: UNITY_EMAIL + UNITY_PASSWORD secrets.
on:
  workflow_dispatch:
    inputs:
      branch: { description: "Branch holding the Unity project (e.g. project-Play)", default: "" }
      recover_run: { description: "Or: run id of a recover run (artifact recovered-project)", default: "" }
      mode: { description: "compile, ipa, or sim (build for the iPhone Simulator and run it there)", default: "compile" }
      name: { description: "Short name for the IPA", default: "Game" }
      bundle_id: { default: "com.duckyisc00l.game" }
      unity_version: { description: "Blank = the project's own. Use 2022.3.x when Xcode crashes in System.ConsolePal (IL2CPP) on 2021/2022.1-2022.2", default: "" }
permissions:
  contents: write
  actions: read
concurrency:
  group: unity-build-${{ inputs.name }}
  cancel-in-progress: true
jobs:
  export:
    # Unity 2022 needs libxml2.so.2, which ubuntu-latest (26.04) dropped.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h / | tail -1
      - name: Get the project (branch)
        if: inputs.branch != ''
        uses: actions/checkout@v4
        with: { ref: "${{ inputs.branch }}", path: proj, lfs: true }
      - name: Get the project (recover artifact)
        if: inputs.branch == ''
        uses: actions/download-artifact@v4
        with:
          name: recovered-project
          run-id: ${{ inputs.recover_run }}
          github-token: ${{ github.token }}
          path: proj
      - name: Project's Unity version
        run: |
          v=$(grep m_EditorVersion: proj/ProjectSettings/ProjectVersion.txt | awk '{print $2}' | sed 's/c[0-9]*$//')
          if [ -n "${{ inputs.unity_version }}" ]; then echo "upgrading $v -> ${{ inputs.unity_version }}"; v="${{ inputs.unity_version }}"; fi
          echo "UNITY_VERSION=$v" >> $GITHUB_ENV; echo "Unity $v"
          mkdir -p proj/Assets/Editor/CI out && cp ci/unity/Build.cs proj/Assets/Editor/CI/
      - name: Cache Unity's import cache (Library)
        uses: actions/cache@v4
        with:
          path: proj/Library
          key: library-${{ inputs.name }}-${{ env.UNITY_VERSION }}-${{ hashFiles('proj/Packages/manifest.json') }}
          restore-keys: library-${{ inputs.name }}-${{ env.UNITY_VERSION }}-
      - name: Install Unity (first try; Hub often crashes on its first start)
        continue-on-error: true
        timeout-minutes: 8
        uses: RageAgainstThePixel/unity-setup@v2
        with: { unity-version: "${{ env.UNITY_VERSION }}", build-targets: iOS, version-file: None, hub-version: 3.12.1, auto-update-hub: false, cache-installation: true }
      - name: Install Unity (retry)
        uses: RageAgainstThePixel/unity-setup@v2
        with: { unity-version: "${{ env.UNITY_VERSION }}", build-targets: iOS, version-file: None, hub-version: 3.12.1, auto-update-hub: false, cache-installation: true }
      - name: Activate Unity Personal license
        uses: RageAgainstThePixel/activate-unity-license@v2
        with: { license: personal, username: "${{ secrets.UNITY_EMAIL }}", password: "${{ secrets.UNITY_PASSWORD }}" }
      - name: Unity (${{ inputs.mode }})
        env:
          CI_BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set +e
          method=CI.Build.Compile; [ "${{ inputs.mode }}" != compile ] && method=CI.Build.iOS
          [ "${{ inputs.mode }}" = sim ] && export CI_SIMULATOR=1
          "$UNITY_EDITOR_PATH" -batchmode -nographics -projectPath "$PWD/proj" -buildTarget iOS \
            -executeMethod $method -logFile out/unity.log
          code=$?; echo "unity exit $code" | tee out/summary.txt
          grep -E "error CS[0-9]+" out/unity.log | sed 's#.*/proj/##' | sort -u > out/cs-errors.txt
          echo "C# errors: $(wc -l < out/cs-errors.txt)" | tee -a out/summary.txt
          grep -oE "error CS[0-9]+" out/cs-errors.txt | sort | uniq -c | sort -rn | head -20 | tee -a out/summary.txt
          grep -E "CI (BUILD|COMPILE) RESULT|Scripts have compiler errors|No valid Unity Editor license" out/unity.log | head -5 | tee -a out/summary.txt
          grep -A25 "CI BUILD ERROR" out/unity.log | grep -vE "StackTraceUtility|DebugLogHandler|UnityEngine.Logger|UnityEngine.Debug:" | head -200 | tee -a out/summary.txt || true
          # every error line with 3 lines after it (the log is too long to keep whole)
          grep -nE -A3 "(^|[^a-z])(Error|error|Exception|BuildFailedException)([^a-z]|$)|Building .* failed" out/unity.log \
            | grep -vE "Debug.LogError|UnityEngine.StackTraceUtility|^--$|Unloading|ALLOC_" | head -150 > out/build-errors.txt || true
          exit $code
      - name: Keep the Xcode project
        if: inputs.mode != 'compile'
        uses: actions/upload-artifact@v4
        with: { name: xcode-project, path: proj/build/iOS }
      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: export-logs, path: out }
  ipa:
    needs: export
    if: inputs.mode != 'compile'
    # Older Unity versions' IL2CPP crashes on macOS 26 (System.ConsolePal "Array dimensions exceeded"): use macOS 15.
    runs-on: macos-15-intel   # Apple-chip Macs often queue for 15+ minutes; Intel ones build iPhone apps too
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { path: lab, sparse-checkout: ci/sim }
      - uses: actions/download-artifact@v4
        with: { name: xcode-project, path: ios }
      - name: Build and run in the iPhone Simulator
        if: inputs.mode == 'sim'
        run: |
          mkdir -p out; cd ios; set +e
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build > ../out/xcodebuild.log 2>&1
          xc=$?; echo "xcodebuild (simulator) exit $xc" | tee ../out/log.txt; grep -E "error:|\*\* BUILD" ../out/xcodebuild.log | head -30 | tee -a ../out/log.txt
          [ "$xc" = 0 ] || exit 1
          app=$(find dd/Build/Products -maxdepth 2 -name '*.app' | head -1); cd ..
          lab/ci/sim/run.sh "ios/$app" out/sim 40
      - name: Build unsigned IPA
        if: inputs.mode == 'ipa'
        run: |
          mkdir -p out; xcodebuild -version | tee out/log.txt
          cd ios
          set +e
          # TERM=dumb: Unity's IL2CPP tool (.NET) crashes in System.ConsolePal ("Array dimensions exceeded") with the runner's TERM.
          TERM=dumb xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > ../out/xcodebuild.log 2>&1
          xc=$?; echo "xcodebuild exit $xc" | tee -a ../out/log.txt
          grep -E "error:|\*\* BUILD" ../out/xcodebuild.log | head -40 | tee -a ../out/log.txt
          [ "$xc" = 0 ] || { grep -E "error:|Exception|failed" ../out/xcodebuild.log | head -20; exit 1; }
          app=$(find dd/Build/Products -maxdepth 2 -name '*.app' | head -1); [ -n "$app" ] || exit 1
          mkdir -p Payload && cp -R "$app" Payload/ && zip -qry "../${{ inputs.name }}.ipa" Payload
          cd .. && ls -la *.ipa | tee -a out/log.txt
      - name: Publish the IPA as a release
        if: inputs.mode == 'ipa'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${{ inputs.name }}-${{ github.run_number }}" "${{ inputs.name }}.ipa" -R "${{ github.repository }}" --notes "Unsigned IPA (lab test build)." --prerelease
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ipa-logs, path: out }
  publish:
    needs: [export, ipa]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art, pattern: "*-logs" }
      - name: Publish logs to branch r-build-${{ inputs.name }}
        run: |
          mkdir -p /tmp/r
          for f in $(find art -type f); do d=/tmp/r/$(echo "${f#art/}" | tr / -); case "$f" in *.log) tail -400 "$f" > "$d";; *) cp "$f" "$d";; esac; done
          git config user.name lab-bot && git config user.email lab-bot@users.noreply.github.com
          git checkout --orphan "r-build-${{ inputs.name }}" && git rm -rfq . && rm -rf art ci
          cp -r /tmp/r/. . && git add -A && git commit -qm "build ${{ github.run_number }}" && git push -f origin "r-build-${{ inputs.name }}"
