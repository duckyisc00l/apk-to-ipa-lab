name: route-detect-suite
# Skill step 1 on real open-source APKs: engine, variant, route and protection flags for every app in
# ci/detect-suite/apps.txt, compared with the engine each repo really uses. Also plants each protection
# sign into clean real apps (fixtures). "scout" mode searches GitHub for more test apps.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "run (the suite) or scout (find candidates)"
        default: run
      list:
        description: "list file"
        default: ci/detect-suite/apps.txt
  push:
    branches: [main]
    paths: ["ci/detect-suite/**", "ci/protect.py", ".github/workflows/route-detect-suite.yml"]
permissions:
  contents: write
concurrency:
  group: route-detect-suite-${{ inputs.mode || 'run' }}
  cancel-in-progress: true
jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ inputs.mode || 'run' }}
      LIST: ${{ inputs.list || 'ci/detect-suite/apps.txt' }}
      SCOUT_LIST: ${{ inputs.list != 'ci/detect-suite/apps.txt' && inputs.list || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - name: Suite or scout
        run: |
          mkdir -p out
          if [ "$MODE" = scout ]; then python3 -u ci/detect-suite/suite.py scout "${SCOUT_LIST:-ci/detect-suite/scout.txt}" 2>&1 | tee out/scout.log
          else python3 -u ci/detect-suite/suite.py run "$LIST" 2>&1 | tee out/suite.log; fi
      - name: Protection fixtures (signs planted into clean real apps)
        if: env.MODE == 'run'
        run: |
          get() { python3 - "$1" "$2" <<'P'
          import sys, importlib.util
          spec = importlib.util.spec_from_file_location("s", "ci/detect-suite/suite.py"); s = importlib.util.module_from_spec(spec); spec.loader.exec_module(s)
          a = s.pick_asset(sys.argv[1]); print(a["url"]) if a else sys.exit(1)
          P
          }
          mkdir -p fx
          for x in "AnimaRain/ShootAR unity" "Ahmadrezadl/legendary-chess gm" "TeamNewPipe/NewPipe java"; do
            set -- $x; url=$(get $1 $2) && curl -sSL --fail -o fx/$2.apk "$url" && python3 -I ci/unpack.py fx/$2.apk fx/$2 > /dev/null
          done
          python3 ci/detect-suite/fixtures.py fx/unity/all fx/gm/all fx/java/all | tee out/fixtures.log
      - name: Publish to branch r-detect-suite
        if: always()
        run: |
          mkdir -p /tmp/r; cp out/* /tmp/r/ 2>/dev/null || true
          cd /tmp/r && git init -q -b r-detect-suite-$MODE && git config user.name lab-bot && git config user.email lab-bot@users.noreply.github.com
          git add -A && git commit -qm "detect-suite $MODE ${{ github.run_number }}" && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" r-detect-suite-$MODE
