name: route-gamemaker
# Skill step G1 on a second, unrelated GameMaker APK: read the data file's version,
# run it on the open-source Butterscotch runner (Linux, headless), take screenshots.
# Job "ios" (step G2 + S): the same data file, unchanged, on Butterscotch built for iPhone (ci/gamemaker/ios:
# OpenGL ES 3 through EAGL, miniaudio, Objective-C app shell) -> unsigned IPA, plus a Simulator run with taps.
on:
  workflow_dispatch:
    inputs:
      repo: { default: "Ahmadrezadl/legendary-chess" }
      jobs: { default: "ios", description: "linux, ios or both" }
      taps: { default: "", description: "Simulator steps, tap X Y in game pixels, ';'-separated (empty = the chess moves below)" }
      game_size: { default: "1080x2160", description: "the game's real window size, for tap positions (the data file may say 100x100)" }
      orientation: { default: "auto", description: "auto (from AndroidManifest.xml), portrait or landscape" }
  push:
    branches: [main]
    paths: [".github/workflows/route-gamemaker.yml", "ci/gamemaker/**"]
permissions:
  contents: write
concurrency:
  group: route-gamemaker
  cancel-in-progress: true
env:
  REPO: ${{ inputs.repo || 'Ahmadrezadl/legendary-chess' }}
  GH_TOKEN: ${{ github.token }}
jobs:
  g1:
    if: github.event_name == 'push' || contains(inputs.jobs, 'linux') || contains(inputs.jobs, 'both')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download the APK and find the data file
        run: |
          echo "$REPO" > /tmp/one.txt; CANDIDATES=/tmp/one.txt MAX_GAMES=1 python3 ci/scout.py
          python3 ci/detect.py dl work
          data=$(find work -name game.droid -o -name data.win | head -1); echo "DATA=$data" >> $GITHUB_ENV
          python3 - "$data" <<'E' | tee -a out/gamemaker.md
          import struct, sys
          d = open(sys.argv[1], "rb").read()
          assert d[:4] == b"FORM", "not a GameMaker data file"
          i = 8
          while i < len(d):
              name, size = d[i:i+4].decode("latin1"), struct.unpack("<I", d[i+4:i+8])[0]
              if name == "GEN8":
                  g = d[i+8:i+8+size]
                  print("bytecode version:", g[1])
                  major, minor, release, build = struct.unpack("<4I", g[44:60])
                  print(f"GameMaker version field: {major}.{minor}.{release}.{build}")
                  break
              i += 8 + size
          print("data file MB:", round(len(d) / 1048576, 1))
          E
      - name: Build the Butterscotch runner (Linux, SDL2)
        run: |
          sudo rm -f /var/lib/man-db/auto-update   # man-db's trigger made apt-get take over 6 minutes
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake libsdl2-dev libopenal-dev libgl1-mesa-dev libgl1-mesa-dri xvfb xdotool gdb imagemagick >/dev/null
          mkdir engine && cd engine && git init -q && git fetch -q --depth 1 https://github.com/ButterscotchRunner/Butterscotch ad34ff419de41bed2fa91b1d2ebd3ecfa586ff89 && git checkout -q FETCH_HEAD && cd ..
          python3 -I ci/gamemaker/fix_vm.py engine | tee -a out/gamemaker.md
          echo "engine: $(git -C engine log -1 --format='%h %ad' --date=short)" | tee -a out/gamemaker.md
          cmake -S engine -B engine/build -DBACKEND=sdl2 -DCMAKE_BUILD_TYPE=RelWithDebInfo > out/cmake.log 2>&1
          cmake --build engine/build -j4 > out/build.log 2>&1; echo "build exit $?" | tee -a out/gamemaker.md
          find engine/build -maxdepth 2 -type f -perm -u+x -name 'butterscotch*' | tee -a out/gamemaker.md
      - name: Run the game and take screenshots
        run: |
          BIN=$(find engine/build -maxdepth 2 -type f -perm -u+x -name 'butterscotch*' | head -1)
          "$BIN" --help > out/help.txt 2>&1 || true
          "$BIN" --print-unknown-functions "$DATA" > out/unknown-functions.txt 2>&1 || true
          for f in 60 300 900; do
            SDL_AUDIODRIVER=dummy ALSOFT_DRIVERS=null timeout 240 xvfb-run -a -s "-screen 0 1280x960x24" "$BIN" \
              --screenshot out/frame-$f.png --screenshot-at-frame $f --exit-at-frame $((f+1)) "$DATA" > out/run-$f.log 2>&1
            echo "frame $f exit $?" | tee -a out/gamemaker.md
          done
          echo "unknown functions: $(grep -c . out/unknown-functions.txt)" | tee -a out/gamemaker.md
          ls -la out/*.png 2>/dev/null | tee -a out/gamemaker.md
      - name: Tap test (mouse clicks through xdotool, under gdb so a crash prints a backtrace)
        timeout-minutes: 6   # gdb ignores the stop signal while the game runs: kill it outright
        run: |
          BIN=$(find engine/build -maxdepth 2 -type f -perm -u+x -name 'butterscotch*' | head -1)
          Xvfb :9 -screen 0 1500x2400x24 & sleep 2; export DISPLAY=:9 SDL_AUDIODRIVER=dummy ALSOFT_DRIVERS=null
          # the game resizes its window to 1080x2160, so window pixels are game pixels. Legendary Chess: e2 = (604,1400), e4 = (604,1144)
          timeout 120 gdb -q -batch -ex run -ex bt -ex "info registers rip" --args "$BIN" --os-type android --window-size 540x1080 "$DATA" > out/tap-gdb.log 2>&1 &
          sleep 12; W=$(xdotool search --name . | tail -1); echo "window $W $(xdotool getwindowgeometry $W | tr '\n' ' ')" | tee -a out/gamemaker.md
          click() { xdotool mousemove --window $W $1 $2; sleep 0.3; xdotool mousedown 1; sleep 0.15; xdotool mouseup 1; sleep 1.5; }
          import -window root out/tap-0.png
          click 604 1400; import -window root out/tap-1-selected.png
          click 604 1144; import -window root out/tap-2-e4.png
          click 604 760; click 604 1016; import -window root out/tap-3-e5.png
          click 120 1700; sleep 2; import -window root out/tap-4-reset.png   # Reset pops the undo history (variable_clone copies)
          sleep 3; pkill -9 -f butterscotch || true; pkill -9 gdb || true; pkill -9 Xvfb || true; sleep 2
          echo "tap test: $(grep -c . out/tap-gdb.log) log lines; signals: $(grep -E 'SIG|signal' out/tap-gdb.log | head -3 | tr '\n' ' ')" | tee -a out/gamemaker.md
      - name: Publish to branch r-gamemaker
        if: always()
        run: |
          mkdir -p /tmp/r && cp out/*.md out/*.txt out/*.png /tmp/r/ 2>/dev/null; for f in out/*.log; do tail -80 "$f" > /tmp/r/$(basename "$f"); done
          git config user.name lab-bot && git config user.email lab-bot@users.noreply.github.com
          git checkout --orphan r-gamemaker && git rm -rfq . && rm -rf ci dl work out engine
          cp -r /tmp/r/. . && git add -A && git commit -qm "gamemaker ${{ github.run_number }}" && git push -f origin r-gamemaker

  ios:
    if: contains(inputs.jobs, 'ios') || contains(inputs.jobs, 'both')   # Mac minutes: only when asked
    runs-on: macos-15-intel
    timeout-minutes: 75
    env:
      BS_COMMIT: ad34ff419de41bed2fa91b1d2ebd3ecfa586ff89
      TAPS: ${{ inputs.taps }}
      GAME_SIZE: ${{ inputs.game_size || '1080x2160' }}
      ORIENT: ${{ inputs.orientation || 'auto' }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the APK and find the data file
        run: |
          echo "$REPO" > /tmp/one.txt; CANDIDATES=/tmp/one.txt MAX_GAMES=1 python3 ci/scout.py > /dev/null
          python3 ci/detect.py dl work > /dev/null
          data=$(find work -name game.droid -o -name data.win | head -1); echo "DATA=$data" >> $GITHUB_ENV
          mkdir -p out/sim; echo "data file: $data ($(du -h "$data" | cut -f1))" | tee out/ios.md
      - name: Build Butterscotch for iPhone and for the Simulator (static library, PLATFORM=ios)
        run: |
          mkdir engine && cd engine && git init -q && git fetch -q --depth 1 https://github.com/ButterscotchRunner/Butterscotch $BS_COMMIT && git checkout -q FETCH_HEAD && cd ..
          python3 -I ci/gamemaker/fix_vm.py engine | tee -a out/ios.md
          python3 -I ci/gamemaker/ios/patch_engine.py engine | tee -a out/ios.md
          common="-DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY -DCMAKE_BUILD_TYPE=Release
            -DPLATFORM=ios -DENABLE_MODERN_GL=ON -DENABLE_LEGACY_GL=OFF -DAUDIO_BACKEND=miniaudio -DVIDEO_BACKEND=none"
          for kind in device sim; do
            if [ $kind = device ]; then sys="-DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64"
            else sys="-DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=x86_64"; fi
            cmake -S engine -B build-$kind $common $sys > out/cmake-$kind.log 2>&1
            cmake --build build-$kind -j4 > out/build-$kind.log 2>&1; echo "engine build ($kind) exit $?" | tee -a out/ios.md
            grep -E "error:" out/build-$kind.log | sort -u | head -15 | tee -a out/ios.md
            ls build-$kind/*.a | tee -a out/ios.md
          done
      - name: Assemble the apps (unsigned IPA for iPhone, .app for the Simulator)
        run: |
          read GW GH < <(python3 - "$DATA" <<'E'
          import struct, sys
          d = open(sys.argv[1], "rb").read(); i = 8
          while i < len(d):
              n, s = d[i:i+4], struct.unpack("<I", d[i+4:i+8])[0]
              if n == b"GEN8":
                  g = d[i+8:i+8+s]; print(*struct.unpack("<2I", g[60:68])); break
              i += 8 + s
          E
          )
          echo "game window in the data file: $GW x $GH" | tee -a out/ios.md
          # which way to hold the phone: the APK's manifest says; the data file's window size is only a fallback
          man=$(find work -maxdepth 3 -name AndroidManifest.xml | head -1)
          if [ "$ORIENT" = auto ] && [ -n "$man" ]; then ORIENT=$(python3 -I ci/gamemaker/orientation.py "$man" "$DATA" 2>> out/ios.md); fi
          if [ "$ORIENT" != portrait ] && [ "$ORIENT" != landscape ]; then ORIENT=$([ "$GH" -gt "$GW" ] && echo portrait || echo landscape); fi
          echo "orientation: $ORIENT (manifest: ${man:-none})" | tee -a out/ios.md
          NAME=$(basename "$REPO"); BID="lab.gamemaker.$(echo "$NAME" | tr -cd 'a-zA-Z0-9')"
          for kind in device sim; do
            if [ $kind = device ]; then sdk=iphoneos; target=arm64-apple-ios15.0; plat=iPhoneOS
            else sdk=iphonesimulator; target=x86_64-apple-ios15.0-simulator; plat=iPhoneSimulator; fi
            APP=app-$kind/Payload/App.app; mkdir -p "$APP"
            cp -R "$(dirname "$DATA")" "$APP/game"     # the data file and the files next to it (sounds, included files), unchanged
            xcrun -sdk $sdk clang -target $target -isysroot "$(xcrun --sdk $sdk --show-sdk-path)" -fobjc-arc -O2 \
              -Ici/gamemaker/ios ci/gamemaker/ios/main.m -Wl,-all_load $(find build-$kind -name '*.a') -lc++ \
              -framework UIKit -framework Foundation -framework QuartzCore -framework OpenGLES -framework CoreGraphics \
              -framework AVFoundation -framework AudioToolbox -framework CoreAudio -o "$APP/App" > out/link-$kind.log 2>&1
            echo "link ($kind) exit $?" | tee -a out/ios.md; grep -E "error|Undefined" out/link-$kind.log | head -20 | tee -a out/ios.md
            python3 - "$APP/Info.plist" "$NAME" "$BID" "$plat" "$ORIENT" <<'E'
          import plistlib, sys
          out, name, bid, plat, orient = sys.argv[1:]
          o = ["UIInterfaceOrientationPortrait"] if orient == "portrait" else ["UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight"]
          plistlib.dump({"CFBundleDisplayName": name, "CFBundleName": name[:15], "CFBundleExecutable": "App", "CFBundleIdentifier": bid,
              "CFBundlePackageType": "APPL", "CFBundleShortVersionString": "1.0", "CFBundleVersion": "1", "CFBundleSupportedPlatforms": [plat],
              "LSRequiresIPhoneOS": True, "MinimumOSVersion": "15.0", "UIDeviceFamily": [1, 2], "UILaunchScreen": {}, "UIRequiresFullScreen": True,
              "UIStatusBarHidden": True, "UISupportedInterfaceOrientations": o, "UISupportedInterfaceOrientations~ipad": o,
              "UIFileSharingEnabled": True, "LSSupportsOpeningDocumentsInPlace": True}, open(out, "wb"))
          E
          done
          (cd app-device && zip -qry ../out/$NAME-unsigned.ipa Payload); ls -la out/*.ipa | tee -a out/ios.md; file app-*/Payload/App.app/App | tee -a out/ios.md
      - name: Run in the iPhone Simulator, tap through, take screenshots
        timeout-minutes: 30
        run: |
          # tap targets are in game pixels; turn them into simulator points (the runner fits the game to the screen, centred)
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys,re
          d=json.load(sys.stdin)['devices']
          rts=sorted([k for k in d if 'iOS' in k], key=lambda k:[int(x) for x in re.findall(r'\d+',k)])
          for rt in reversed(rts):
              ph=[x for x in d[rt] if x['name'].startswith('iPhone')]
              if ph: print(ph[-1]['udid']); break")
          xcrun simctl boot "$UDID" 2>/dev/null; xcrun simctl bootstatus "$UDID" -b > /dev/null || true
          xcrun simctl io "$UDID" screenshot /tmp/home.png > /dev/null 2>&1
          # Legendary Chess default: wait past the splash, then move the white e-pawn e2-e4 and the black e-pawn e7-e5.
          # Board: 8 squares of 128 px from (28,568) in a 1080x2160 game.
          [ -n "$TAPS" ] || TAPS="wait 6;shot board;tap 604 1400;wait 1;shot selected;tap 604 1144;wait 2;shot e4;tap 604 760;wait 1;tap 604 1016;wait 2;shot e5;tap 120 1700;wait 2;shot reset"
          python3 - /tmp/home.png "$GAME_SIZE" "$TAPS" > out/sim/steps.txt <<'E'
          import struct, sys
          png, size, taps = sys.argv[1:]
          gw, gh = map(int, size.split("x"))
          W, H = struct.unpack(">2I", open(png, "rb").read()[16:24])
          if (H > W) != (gh > gw): W, H = H, W     # the app turns the screen to the game's orientation
          s = min(W / gw, H / gh); ox, oy = (W - gw * s) / 2, (H - gh * s) / 2
          for step in taps.split(";"):
              p = step.split()
              if p and p[0] == "tap":    # as % of the screen, so it works on any iPhone (run.sh turns % into points)
                  print(f"tap {100 * (ox + int(p[1]) * s) / W:.1f}% {100 * (oy + int(p[2]) * s) / H:.1f}%")
              else:
                  print(step.strip())
          print(f"# screen {W}x{H} px, scale {s:.3f}, offset {ox:.0f},{oy:.0f}", file=sys.stderr)
          E
          cat out/sim/steps.txt | tee -a out/ios.md
          ci/sim/run.sh app-sim/Payload/App.app out/sim 20 out/sim/steps.txt; echo "sim exit $?" | tee -a out/ios.md
      - name: Publish to branch r-gamemaker-ios
        if: always()
        run: |
          mkdir -p /tmp/r && cp -R out/. /tmp/r/; for f in out/*.log; do tail -120 "$f" > /tmp/r/$(basename "$f"); done
          git config user.name lab-bot && git config user.email lab-bot@users.noreply.github.com
          git checkout -q --orphan r-gamemaker-ios && git rm -rfq . && rm -rf ci dl work out engine build-* app-*
          cp -R /tmp/r/. . && git add -A && git commit -qm "gamemaker ios ${{ github.run_number }}" && git push -qf origin r-gamemaker-ios
