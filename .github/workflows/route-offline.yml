name: route-offline
# Skill step O proved on Bim! (AGPLv3, client + server open source): the game plays a full match with the
# network cut off. Its own server runs on the same machine with computer players on; the client is patched
# (ci/offline/bim_offline.py) to use it and to go on without the sign-in server. Screenshots to r-offline.
# Job asan: the same game built with AddressSanitizer, first without the scheduler fix (shows the upstream
# use-after-free behind the old crash), then with it (a clean match). Results to r-offline-asan.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: route-offline
  cancel-in-progress: true
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        type: [release, asan]
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
      options: --cap-add=NET_ADMIN
    timeout-minutes: 180
    defaults:
      run:
        shell: bash   # the container's default is sh -e
    env:
      T: ${{ matrix.type }}
    steps:
      - name: Tools (all of them before the network is cut)
        run: apt-get update -qq && apt-get install -y -qq git ca-certificates iproute2 procps iptables xvfb xauth curl python3 gdb x11-apps imagemagick > /dev/null
      - uses: actions/checkout@v4
        with: { path: lab }
      - name: Get Bim's source and patch it for offline
        run: |
          mkdir -p out; git clone -q --depth 1 https://github.com/j-jorge/bim bim
          git -C bim log -1 --format=%H > bim-commit
          # A cached build of the same commit is reused: sources get an old date before the patch, so only the
          # patched files (newer) are compiled again. Cache from another commit: next step, full build.
          (cd bim && git ls-files -z | xargs -0 touch -h -d 2001-01-01)
          echo "bim $(git -C bim log -1 --format='%h %ad' --date=short), build $T" | tee out/offline.md
          K=""; [ "$T" = asan ] && K="--keep-crash"
          python3 -I lab/ci/offline/bim_offline.py bim 23899 $K | tee -a out/offline.md
      - name: Cache Bim's build (40 minutes from scratch)
        uses: actions/cache@v4
        with:
          path: |
            bim/build
            bim/.backroom
          key: bim-build-${{ matrix.type }}-${{ hashFiles('lab/ci/offline/bim_offline.py') }}-v2
          restore-keys: bim-build-${{ matrix.type }}-
      - name: Same commit as the cached build? Otherwise rebuild everything
        run: |
          if [ "$(cat bim/build/commit 2>/dev/null)" != "$(cat bim-commit)" ]; then
            echo "cache: none or another commit, full build" | tee -a out/offline.md
            (cd bim && git ls-files -z | xargs -0 touch -h); rm -rf bim/build/linux
          else echo "cache: same commit, only patched files are compiled" | tee -a out/offline.md; fi
      - name: Build environment and build (Bim's own scripts)
        run: |
          cd bim
          ./setup/install-minimal-environment.sh --compiler g++ --target-platform linux > ../out/env.log 2>&1; echo "env exit $?" | tee -a ../out/offline.md
          set +e
          ./setup.sh --target-platform linux --build-type $T --build-steps dependencies configure build > ../out/build.log 2>&1
          echo "build exit $?" | tee -a ../out/offline.md; cp ../bim-commit build/commit
          echo "B=$PWD/build/linux/$T" >> $GITHUB_ENV; ls build/linux/$T/apps/linux/bim build/linux/$T/apps/server/bim-server | tee -a ../out/offline.md
      - name: Cut the network (only this machine itself stays reachable)
        run: |
          # The game's own hosts point at this machine (nothing listens there), and everything else is refused
          # at once, so no request leaves and no request hangs.
          printf '127.0.0.2 bim-prod.jorge.st\n127.0.0.2 bim.jorge.st\n' >> /etc/hosts
          iptables -P OUTPUT DROP; iptables -A OUTPUT -o lo -j ACCEPT
          iptables -A OUTPUT -p tcp -j REJECT --reject-with tcp-reset; iptables -A OUTPUT -j REJECT
          if curl -sS -m 8 https://github.com > /dev/null 2>&1; then echo "network still up!" | tee -a out/offline.md; exit 1; else echo "internet: cut (curl to github.com fails)" | tee -a out/offline.md; fi
      - name: Server with computer players, on this machine
        run: |
          # The server's JSON keys are its option names with dashes: "enable_bots" is silently ignored.
          printf '{"port": 23899, "enable-bots": true, "matchmaking-delay-for-bot": 2}\n' > server.cfg
          ("$B/apps/server/bim-server" --console-log --config server.cfg > out/server.log 2>&1 &); sleep 5
          grep -E "up on port" out/server.log | head -1 | tee -a out/offline.md
      - name: Play a match against a bot (Bim's own UI script runner, screenshots)
        run: |
          set +e
          export ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 UBSAN_OPTIONS=print_stacktrace=1
          [ "$T" = asan ] && export NO_GDB=1
          P=lab/ci/offline/bim_play.sh; S=$GITHUB_WORKSPACE/lab/ci/offline/vs-bot.json; O=$GITHUB_WORKSPACE/out
          C() { sed 's/\x1b\[[0-9;]*m//g' "$O/client-$1.log"; }
          # 1. no script, 25 s, screenshot of the X screen
          ( export BIM_OFFLINE=1; xvfb-run -a -s "-screen 0 1080x2220x24" bash -c "
              '$B/apps/linux/bim' --assets '$PWD/bim/static-assets/' '$B/assets/generated/' --console-log --app-dir /tmp/app-plain > '$O/client-plain.log' 2>&1 &
              sleep 22; import -window root '$O/plain-start.png'; kill %1" ) || true
          echo "## plain start (no script): last lines" >> out/offline.md; C plain | grep -E "^\[|ERROR|SUMMARY" | tail -8 >> out/offline.md
          if [ "$T" = asan ]; then
            # 2. ASan, upstream scheduler bridge: expect a use-after-free report
            ( export BIM_OFFLINE=1; $P "$PWD/bim" "$B" "$O" asan-upstream "$S" ); echo "asan-upstream exit $?" | tee -a out/offline.md
            C asan-upstream | grep -A30 "ERROR: AddressSanitizer\|runtime error" | head -60 >> out/offline.md
            # rebuild with the fix (only bridge.cpp changes) and play again
            python3 -I - bim <<'PY'
          import sys; p = sys.argv[1] + "/modules/axmol/schedule/main/src/bim/axmol/schedule/bridge.cpp"
          s = open(p).read(); open(p, "w").write(s.replace("[&f](float)", "[f](float)"))
          PY
            (cd bim && ./setup.sh --target-platform linux --build-type asan --build-steps build > ../out/build-fix.log 2>&1); echo "fix rebuild exit $?" | tee -a out/offline.md
          fi
          # A = the game's original behaviour with no internet; B = with the offline change switched on
          for mode in A B; do
            [ "$mode" = B ] && export BIM_OFFLINE=1 || unset BIM_OFFLINE
            $P "$PWD/bim" "$B" "$O" $mode "$S" | tee -a out/offline.md
            echo "## run $mode (BIM_OFFLINE=${BIM_OFFLINE:-unset})" >> out/offline.md
            C $mode | grep -iE "main_task|business|game server|matchmak|script|offline|error|SUMMARY|signal SIG" | tail -25 >> out/offline.md
            C $mode | grep -A25 "signal SIG\|ERROR: AddressSanitizer\|runtime error" | head -40 >> out/offline.md || true
          done
          # C = no separate server: the game's server runs inside the client (BIM_LOCAL_SERVER=1)
          pkill -INT -f apps/server/bim-server; sleep 2
          ( export BIM_OFFLINE=1 BIM_LOCAL_SERVER=1; $P "$PWD/bim" "$B" "$O" C "$S" | tee -a out/offline.md )
          echo "## run C (server inside the client)" >> out/offline.md
          C C | grep -iE "Local game server|main_task|business|game server|matchmak|script|offline|error|SUMMARY|signal SIG" | tail -25 >> out/offline.md
          C C | grep -A25 "signal SIG\|ERROR: AddressSanitizer\|runtime error" | head -40 >> out/offline.md || true
          echo "## server" >> out/offline.md; sed 's/\x1b\[[0-9;]*m//g' out/server.log | grep -iE "bot|game|session|encounter" | tail -25 >> out/offline.md
      - name: Publish to branch r-offline / r-offline-asan
        if: always()
        run: |
          iptables -P OUTPUT ACCEPT || true; iptables -F OUTPUT || true
          R=r-offline; [ "$T" = asan ] && R=r-offline-asan
          mkdir -p /tmp/r; cp out/*.md out/*.png /tmp/r/ 2>/dev/null || true; for f in out/*.log; do tail -300 "$f" > /tmp/r/$(basename "$f"); done
          cd /tmp/r && git init -q -b $R && git config user.name lab-bot && git config user.email lab-bot@users.noreply.github.com
          git config --global --add safe.directory '*'; git add -A && git commit -qm "offline $T ${{ github.run_number }}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" $R
