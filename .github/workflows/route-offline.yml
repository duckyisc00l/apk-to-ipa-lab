name: route-offline
# Skill step O proved on Bim! (AGPLv3, client + server open source): the game plays a full match with the
# network cut off. Its own server runs on the same machine with computer players on; the client is patched
# (ci/offline/bim_offline.py) to use it and to go on without the sign-in server. Screenshots to r-offline.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: route-offline
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
      options: --cap-add=NET_ADMIN
    timeout-minutes: 180
    defaults:
      run:
        shell: bash   # the container's default is sh -e
    steps:
      - name: Tools
        run: apt-get update -qq && apt-get install -y -qq git ca-certificates iproute2 procps iptables xvfb xauth curl python3 gdb > /dev/null
      - uses: actions/checkout@v4
        with: { path: lab }
      - name: Get Bim's source and patch it for offline
        run: |
          mkdir -p out; git clone -q --depth 1 https://github.com/j-jorge/bim bim
          echo "bim $(git -C bim log -1 --format='%h %ad' --date=short)" | tee out/offline.md
          python3 -I lab/ci/offline/bim_offline.py bim 23899 | tee -a out/offline.md
      - name: Cache Bim's build (40 minutes from scratch)
        uses: actions/cache@v4
        with:
          path: |
            bim/build
            bim/.backroom
          key: bim-build-${{ hashFiles('lab/ci/offline/bim_offline.py') }}-v1
      - name: Build environment and build (Bim's own scripts)
        run: |
          cd bim
          ./setup/install-minimal-environment.sh --compiler g++ --target-platform linux > ../out/env.log 2>&1; echo "env exit $?" | tee -a ../out/offline.md
          set +e
          ./setup.sh --target-platform linux --build-type release --build-steps dependencies configure build > ../out/build.log 2>&1
          echo "build exit $?" | tee -a ../out/offline.md
          B=$(dirname "$(dirname "$(dirname "$(find build -type f -path '*apps/linux/bim' | head -1)")")")   # .../release; echo "B=$PWD/$B" >> $GITHUB_ENV; echo "build dir $B" | tee -a ../out/offline.md
      - name: Cut the network (only this machine itself stays reachable)
        run: |
          iptables -P OUTPUT DROP; iptables -A OUTPUT -o lo -j ACCEPT
          if curl -sS -m 8 https://github.com > /dev/null 2>&1; then echo "network still up!" | tee -a out/offline.md; exit 1; else echo "internet: cut (curl to github.com fails)" | tee -a out/offline.md; fi
      - name: Server with computer players, on this machine
        run: |
          printf '{"port": 23899, "enable_bots": true, "matchmaking_delay_for_bot": 2}\n' > server.cfg
          (S=$(find "$GITHUB_WORKSPACE/bim/build" -type f -name bim-server | head -1); echo "server $S" | tee -a out/offline.md; "$S" --console-log --config server.cfg > out/server.log 2>&1 &); sleep 5
          grep -E "up on port|bots|Bot" out/server.log | head | tee -a out/offline.md; tail -5 out/server.log | tee -a out/offline.md
      - name: Play a match against a bot (scripted taps, screenshots)
        run: |
          C=$(find "$GITHUB_WORKSPACE/bim/build" -type f -perm -u+x -path '*apps/linux/bim' | head -1); B=$(dirname "$(dirname "$(dirname "$C")")")
          echo "client $C (build $B)" | tee -a out/offline.md; ls "$B" "$B/assets" 2>&1 | head -8 | tee -a out/offline.md
          # A = the game's original behaviour with no internet; B = with the offline change switched on
          for mode in A B; do
            mkdir -p "shots-$mode" "app-$mode"; cd "shots-$mode"
            [ "$mode" = B ] && export BIM_OFFLINE=1 || unset BIM_OFFLINE
            set +e
            timeout 600 xvfb-run -a -s "-screen 0 1080x1920x24" gdb -batch -ex run -ex bt -ex "frame 1" -ex 'info symbol $pc' -ex 'info line *$pc' -ex "frame 2" -ex 'info symbol $pc' -ex "frame 0" -ex 'x/4gx $rdi' \
              --args "$B/apps/linux/bim" --assets "$GITHUB_WORKSPACE/bim/static-assets/" "$B/assets/generated/" \
              --console-log --script "$GITHUB_WORKSPACE/lab/ci/offline/vs-bot.json" --script-step-timeout 240 --app-dir "$GITHUB_WORKSPACE/app-$mode" > "../out/client-$mode.log" 2>&1
            echo "## run $mode (BIM_OFFLINE=${BIM_OFFLINE:-unset}): $(grep -c 'signal SIG' ../out/client-$mode.log) crash(es); screenshots: $(ls *.png 2>/dev/null | tr '\n' ' ')" | tee -a ../out/offline.md
            grep -iE "StartUp|business|game server|connect|matchmak|bot|script|offline|error" "../out/client-$mode.log" | grep -v "^\[36" | tail -25 >> ../out/offline.md
            grep -A40 "signal SIG" "../out/client-$mode.log" | grep -vE "Saved registers|at 0x7ff" | head -45 >> ../out/offline.md || true
            cd ..; mkdir -p shots; for f in shots-$mode/*.png; do [ -f "$f" ] && cp "$f" "shots/$mode-$(basename "$f")"; done
          done
          tail -20 out/server.log >> out/offline.md
      - name: Publish to branch r-offline
        if: always()
        run: |
          iptables -P OUTPUT ACCEPT || true; iptables -F OUTPUT || true
          mkdir -p /tmp/r; cp out/*.md /tmp/r/ 2>/dev/null || true; cp shots/*.png /tmp/r/ 2>/dev/null || true; for f in out/*.log; do tail -150 "$f" > /tmp/r/$(basename "$f"); done
          cd /tmp/r && git init -q -b r-offline && git config user.name lab-bot && git config user.email lab-bot@users.noreply.github.com
          git config --global --add safe.directory '*'; git add -A && git commit -qm "offline ${{ github.run_number }}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" r-offline
