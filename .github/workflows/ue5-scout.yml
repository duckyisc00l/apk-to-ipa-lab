name: ue5-scout
# UE5 / IoStore task: find licensed Unreal Android builds in GitHub releases (ci/unreal/ue5/scout.py).
# Results to branch r-ue5-scout.
on:
  workflow_dispatch:
    inputs:
      candidates: { description: "candidates file", default: "ci/unreal/ue5/candidates.txt" }
permissions:
  contents: write
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out; python3 ci/unreal/ue5/scout.py "${{ inputs.candidates }}" out 2>&1 | tee out/scout.txt
      - if: always()
        run: |
          cd out && git init -q -b r-ue5-scout && git config user.name lab-bot && git config user.email lab-bot@users.noreply.github.com
          git add -A && git commit -qm "ue5 scout ${{ github.run_number }}" && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" r-ue5-scout
